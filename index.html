<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7a4d">
<title>Superkauf</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-screen" class="login-screen show">
  <div class="login-card">
    <div class="login-logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M2.5 3h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"/></svg> Superkauf</div>
    <p class="login-sub">Einkäufe gemeinsam organisieren.</p>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Mit Google anmelden
    </button>
  </div>
</div>

<div id="app" class="app" style="display:none">

  <header class="app-header">
    <div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M2.5 3h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"/></svg> Superkauf</div>
    <button class="icon-btn" onclick="signOut()" aria-label="Abmelden"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg></button>
  </header>

  <main class="app-main">

    <section id="tab-einkauf" class="tab active">
      <div class="list-toolbar">
        <button class="btn-secondary btn-icon" onclick="openPicker()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Aus Katalog wählen</button>
        <button class="btn-secondary btn-icon" onclick="completeShopping()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg> Einkauf abschließen</button>
      </div>
      <div id="active-list-content" class="scroll-content"></div>
    </section>

    <section id="tab-katalog" class="tab">
      <form id="catalog-add-form" class="inline-add-form" onsubmit="return submitCatalogForm(event)">
        <input type="text" name="name" placeholder="Neuer Stammartikel…" autocomplete="off" required>
        <select name="category_id" class="category-select"></select>
        <input type="text" name="default_quantity" placeholder="Menge (optional)">
        <button type="submit" class="btn-primary btn-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Hinzufügen</button>
      </form>
      <div id="catalog-content" class="scroll-content"></div>
    </section>

    <section id="tab-kategorien" class="tab">
      <form id="category-add-form" class="inline-add-form" onsubmit="return submitCategoryForm(event)">
        <input type="text" name="name" placeholder="Neue Kategorie…" autocomplete="off" required>
        <button type="submit" class="btn-primary btn-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Hinzufügen</button>
      </form>
      <div id="categories-content" class="scroll-content"></div>
    </section>

  </main>

  <form id="quick-add-form" class="quick-add-bar" onsubmit="return handleQuickAdd(event)">
    <input id="quick-add-input" type="text" placeholder="Artikel hinzufügen…" autocomplete="off" required>
    <select id="quick-add-category" name="category_id" class="category-select"></select>
    <label class="quick-add-save-catalog">
      <input type="checkbox" id="quick-add-save-catalog" checked>
      in Katalog
    </label>
    <button type="submit" class="btn-primary quick-add-submit" aria-label="Hinzufügen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </form>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="einkauf" onclick="showTab('einkauf')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5l1.2 1.2L8 5.3"/><path d="M4.5 12.5l1.2 1.2L8 11.3"/><path d="M4.5 18.5l1.2 1.2L8 17.3"/><path d="M11 6.5h9M11 12.5h9M11 18.5h9"/></svg><span>Einkauf</span></button>
    <button class="nav-btn" data-tab="katalog" onclick="showTab('katalog')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg><span>Katalog</span></button>
    <button class="nav-btn" data-tab="kategorien" onclick="showTab('kategorien')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 3H5a2 2 0 0 0-2 2v7.6a2 2 0 0 0 .6 1.4l9.4 9.4a2 2 0 0 0 2.8 0l7-7a2 2 0 0 0 0-2.8L13.4 3.6a2 2 0 0 0-1.4-.6Z"/><circle cx="8" cy="8" r="1.2"/></svg><span>Kategorien</span></button>
  </nav>

  <div id="picker-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Aus Katalog wählen</h2>
        <button class="icon-btn" onclick="closePicker()" aria-label="Schließen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </div>
      <div id="picker-content" class="scroll-content"></div>
      <button class="btn-primary modal-confirm" onclick="confirmPicker()">Übernehmen</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
